name: Desktop

# Builds the Windows installer whenever the app or the code it uses
# changes, and keeps it as a download on the run's page for 14 days.
# The installer is not code-signed yet, so Windows SmartScreen warns
# before running it.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/client-core/**"
      - "crates/vault-core/**"
      - "crates/wire/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      - name: Build the screens
        run: npm run build
      - name: Clippy (Windows)
        working-directory: .
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy -p blackboxus-desktop --all-targets --locked
      - name: Build the installer
        run: npx tauri build --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackboxus-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
