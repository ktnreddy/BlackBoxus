# cargo-deny: checks dependencies for known vulnerabilities, unwanted
# licenses and untrusted sources.

[graph]
all-features = true
# Only the platforms BlackBoxus ships on: the desktop app on Windows and
# the server on WebAssembly. Linux-only crates (GTK and friends, pulled in
# by Tauri for Linux builds) never reach users, so they are left out.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates anywhere in the tree, not only those used
# directly (cargo-deny 0.22 narrowed the default to the workspace's own).
unmaintained = "all"
ignore = [
  # crypto-bigint 0.5 comes in through elliptic-curve, which opaque-ke and
  # voprf use for generic traits only. BlackBoxus uses OPAQUE with
  # ristretto255, whose arithmetic is in curve25519-dalek, so the affected
  # crypto-bigint operations never run on secrets. No fixed 0.5.x exists.
  { id = "RUSTSEC-2026-0387", reason = "affected code is not used: OPAQUE runs on curve25519-dalek" },
  # proc-macro-error2 is a compile-time dependency of libcrux's hax-lib
  # macros. It never runs in BlackBoxus and has no maintained replacement
  # there yet; revisit when libcrux updates hax-lib.
  { id = "RUSTSEC-2026-0173", reason = "unmaintained build-time proc macro used by libcrux; no safe upgrade" },
  # chrono is marked unmaintained (no vulnerability). It comes in through
  # zxcvbn and Cloudflare's worker crate, neither of which offers a version
  # without it yet; revisit when they move to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; used by zxcvbn and worker" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  # Zero-clause BSD: no conditions at all (helpers of the local socket crate).
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  # Boost licence: permissive (Windows clipboard access in the desktop app).
  "BSL-1.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft, compatible with the AGPL (used by Tauri's CSS parser).
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Mozilla's list of trusted root certificates, bundled so the desktop app
# trusts the same authorities everywhere instead of whatever the system adds.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
