[workspace]
resolver = "3"
members = [
    "crates/vault-core",
    "crates/server-core",
    "crates/server-worker",
    "crates/wire",
    "crates/client-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ktnreddy/BlackBoxus"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Security-sensitive code must never panic on bad input.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"

# Argon2id is very slow without optimisation; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
