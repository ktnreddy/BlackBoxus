[package]
name = "vault-core"
description = "BlackBoxus cryptographic core: key derivation, vault encryption, login and sharing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
# Not used directly: enables zeroizing of HMAC state used inside hkdf.
hmac = { version = "0.13.0", features = ["zeroize"] }
opaque-ke = { version = "4", default-features = false, features = ["ristretto255"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
sha2_10 = { version = "0.10", package = "sha2" }
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
