[package]
name = "server-worker"
description = "BlackBoxus server on Cloudflare Workers, D1 and Durable Objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
server-core = { version = "0.0.1", path = "../server-core" }
vault-core = { version = "0.0.1", path = "../vault-core" }
zeroize = "1.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
worker = { version = "0.9", features = ["d1"] }

[lints]
workspace = true

[dev-dependencies]
getrandom_04 = { package = "getrandom", version = "0.4" }
