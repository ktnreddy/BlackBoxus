[package]
name = "blackboxus-desktop"
description = "The BlackBoxus app for Windows, Linux and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "blackboxus_desktop"
# The static and dynamic libraries are what the Android app loads.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blackboxus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["isolation"] }

[dependencies]
client-core = { version = "0.0.1", path = "../../../crates/client-core" }
csv = "1.4.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
keyring-core = "1.0.1"
# The Public Suffix List, to match logins to sites (browser extension and
# Android autofill).
psl = "2.1.253"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = ["isolation"] }
tauri-plugin-dialog = "2.8.4"
# Opens an item's website in the browser; called only from Rust.
tauri-plugin-opener = "2.7.2"
thiserror = "2"
# HTTPS with rustls and Mozilla's root certificates; no system TLS library.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
# The server's "something changed" hints, over the same rustls stack.
url = "2.5.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
vault-core = { version = "0.0.1", path = "../../../crates/vault-core" }
wire = { version = "0.0.1", path = "../../../crates/wire" }
zeroize = { version = "1.9", features = ["serde"] }
zxcvbn = "3.1.1"

# The browser extension, the system clipboard and single-instance launches
# exist only on desktops.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Encrypts messages to the browser extension (spec section 14).
aes-gcm = "0.11.1"
# Copies secrets with Windows told to keep them out of clipboard history
# and cloud sync.
arboard = { version = "3.6", default-features = false }
# The local socket to the browser's native messaging host.
interprocess = "2.4.8"
# The pairing key exchange with the browser extension.
p256 = { version = "0.14.0", features = ["ecdh"] }
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The phone's clipboard, with copies marked sensitive so Android hides them
# from the clipboard preview.
tauri-plugin-clipboard-manager = "2.5.0"
# Reads files picked through the phone's document picker.
tauri-plugin-fs = "2.7.1"
# Scanning QR codes for one-time codes (ML Kit on Android, Apple's own
# camera code on iOS).
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(any(target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
# Fingerprint, Touch ID and Face ID: whether they are set up, and on
# Android the Keystore key that works only after a strong biometric check.
tauri-plugin-biometric = "2.5.0"

[target.'cfg(target_os = "android")'.dependencies]
# Android's Keystore, which holds the key that encrypts stored entries.
android-native-keyring-store = "1.0.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Touch ID and Face ID unlock: a keychain item the system releases only
# after a biometric check with the fingers or face enrolled now.
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The iPhone's keychain.
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(windows)'.dependencies]
# Where each browser finds the native messaging host.
windows-registry = "0.6.1"
# The access list of the named pipe to the native messaging host.
widestring = "1.2"
# The Windows Credential Manager, which encrypts entries for the signed-in
# Windows user.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Windows Hello, through its key credentials held in the TPM.
windows = { version = "0.62.2", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's Secret Service (GNOME Keyring, KWallet), over D-Bus in Rust.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS keychain.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[lints]
workspace = true
