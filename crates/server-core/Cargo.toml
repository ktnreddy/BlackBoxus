[package]
name = "server-core"
description = "BlackBoxus server logic, independent of the hosting platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hmac = { version = "0.13", features = ["zeroize"] }
opaque-ke = { version = "4", default-features = false, features = ["ristretto255"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2"
vault-core = { version = "0.2.0", path = "../vault-core" }
zeroize = "1.9"

[lints]
workspace = true
