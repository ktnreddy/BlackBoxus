name: Release

# Makes a draft GitHub release from a version tag, for example v0.1.0.
# See docs/releasing.md for the whole process.
#
# Nothing is published by this workflow: it builds everything from the
# tagged commit, writes checksums, and leaves a draft for a person to read
# and publish. It refuses to start unless the tag matches the app's
# version, the commit is on main, and CI passed on it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag matches the app's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          for f in apps/desktop/package.json apps/extension/package.json apps/extension/static/manifest.json; do
            [ "$(jq -r .version "$f")" = "$version" ] || { echo "::error::$f has another version than $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml has another version than $version"; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG doesn't match the app's version $version"; exit 1; }
          [ -f "docs/releases/v$version.md" ] || { echo "::error::No release notes in docs/releases/v$version.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$result" -gt 0 ] || { echo "::error::CI hasn't passed on $GITHUB_SHA"; exit 1; }

  apps:
    name: Apps
    needs: check
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
    secrets: inherit

  extension:
    name: Browser extension
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package it
        run: |
          mkdir -p "$RUNNER_TEMP/ext"
          (cd dist && zip -qrX "$RUNNER_TEMP/ext/BlackBoxus-extension-chrome.zip" .)
          (cd dist-firefox && zip -qrX "$RUNNER_TEMP/ext/BlackBoxus-extension-firefox.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackboxus-extension
          path: ${{ runner.temp }}/ext/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Draft the release
    needs: [check, apps, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in
      # Fixed names, so the website can link to the latest release's files.
      - name: Name the files
        run: |
          in="$RUNNER_TEMP/in"; out="$RUNNER_TEMP/out"; mkdir -p "$out"
          one() { n=$(find "$in" -name "$1" | wc -l); [ "$n" -eq 1 ] || { echo "::error::Expected one $1, found $n"; exit 1; }; cp "$(find "$in" -name "$1")" "$out/$2"; }
          one '*-setup.exe' BlackBoxus-windows-x64-setup.exe
          one '*.deb' BlackBoxus-linux-amd64.deb
          one '*.AppImage' BlackBoxus-linux-x86_64.AppImage
          one '*release*.apk' BlackBoxus-android-arm64.apk
          one 'BlackBoxus-extension-chrome.zip' BlackBoxus-extension-chrome.zip
          one 'BlackBoxus-extension-firefox.zip' BlackBoxus-extension-firefox.zip
          (cd "$out" && sha256sum BlackBoxus-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la "$out"
      # Signed statements, kept by GitHub, that these files were built by
      # this workflow from this commit. Free for public repositories.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ runner.temp }}/out/BlackBoxus-*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease";; esac
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag $prerelease \
            --title "BlackBoxus $VERSION" --notes-file "docs/releases/$TAG.md" \
            "$RUNNER_TEMP"/out/*
          echo "Draft ready: review it under Releases, then publish." >> "$GITHUB_STEP_SUMMARY"
