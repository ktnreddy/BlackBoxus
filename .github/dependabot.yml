version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /crates/server-worker
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/extension
    schedule:
      interval: weekly
