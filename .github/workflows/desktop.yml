name: Desktop

# Builds the Windows installer, the Linux packages and the Android app
# whenever the app or the code it uses changes, and keeps them as downloads
# on the run's page for 14 days.
# The installer is not code-signed yet, so Windows SmartScreen warns
# before running it.
#
# The Release workflow runs this too, with `release: true`: then the APK
# must be signed with the real key, never a throwaway one.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/client-core/**"
      - "crates/vault-core/**"
      - "crates/wire/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Building a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      - name: Build the screens
        run: npm run build
      - name: Clippy (Windows)
        working-directory: .
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy -p blackboxus-desktop --all-targets --locked
      - name: Build the installer
        run: npx tauri build --ci --bundles nsis -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackboxus-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-linux
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install build libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      - name: Build the .deb and AppImage
        run: npx tauri build --ci --bundles deb,appimage -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackboxus-linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-android
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      # The APK is signed with the key in the ANDROID_KEY_BASE64 secret, so
      # each build installs over the last. Without the secret, a key is made
      # for this run only: fine for trying the app, but the next build won't
      # install over it.
      - name: Set up the signing key
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          key="$RUNNER_TEMP/blackboxus-upload.jks"
          if [ "$RELEASE" = "true" ] && [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::A release needs the ANDROID_KEY_BASE64 and ANDROID_KEY_PASSWORD secrets (docs/releasing.md)."
            exit 1
          fi
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$key"
            password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEY_BASE64 secret: this APK is signed with a key made for this run only."
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$key" -storetype PKCS12 -alias upload \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$password" -keypass "$password" -dname "CN=BlackBoxus test build"
          fi
          printf 'storeFile=%s\nkeyAlias=upload\npassword=%s\n' "$key" "$password" > keystore.properties
      - name: Build the APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --ci --apk --target aarch64
      - name: Remove the signing key
        if: always()
        working-directory: apps/desktop/src-tauri/gen/android
        run: rm -f keystore.properties "$RUNNER_TEMP/blackboxus-upload.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackboxus-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
